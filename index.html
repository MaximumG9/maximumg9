<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MaximumGWebsite</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="gradient-box">
        <div class="header full-width">Hi I'm <span class="maximumg-shiny">MaximumG9</span></div>
        <div class="body-text full-width">I play minecraft and program mods for minecraft! </div>
        <div class="full-width line-high"></div>
        <div class="body-text full-width">Contact me for a commission by:</div>
        <div class="body-text full-width discord">My Discord (preferred): maximumg9</div>
        <div class="body-text full-width email">My Email: <a href="mailto:maximumg999@gmail.com"> maximumg999@gmail.com </a></div>
        <div class="full-width line-high"></div>
	<div class="body-text full-width" style="color:#444">And if you like what I make, consider <a href="https://ko-fi.com/maximumg9">supporting me on Ko-fi</a></div>
    </div>
        <!-- MaximumG9 yellow is 255 242 0 -->
    <div class="cursor-follower">

    </div>

    <script>
	function updateShiny(e) {
	    let shinyItems = document.getElementsByClassName("maximumg-shiny");

            for(let i=0;i<shinyItems.length;i++) {
                let rect = shinyItems[i].getBoundingClientRect();
                let centerX = rect.x + rect.width/2;
                let centerY = rect.y + rect.height/2;

                let angle = Math.PI-Math.atan2((centerX-e.clientX) / 10,centerY-e.clientY);

                shinyItems[i].style.background = "linear-gradient("+ angle +"rad,rgb(255,242,0),black 120%)";
                shinyItems[i].style.backgroundClip = "text";
            }
	}

	function updateGradBoxes(e) {
	    let gradientBoxes = document.getElementsByClassName("gradient-box");

            for(let i=0;i<gradientBoxes.length;i++) {
                let rect = gradientBoxes[i].getBoundingClientRect();
                let centerX = rect.x + rect.width/2;
                let centerY = rect.y + rect.height/2;

                let angle = -Math.atan2((centerX-e.clientX)/(window.innerWidth),(centerY-e.clientY)/(window.innerHeight));

                gradientBoxes[i].style.setProperty("--angle",angle + "rad");

                xDistNormalized = (centerX-e.clientX)/(window.innerWidth);
                yDistNormalized = (centerY-e.clientY)/(window.innerHeight);

                let dist = Math.sqrt(xDistNormalized * xDistNormalized + yDistNormalized * yDistNormalized);
	    }
	}

        document.onmousemove = (e) => {
            updateShiny(e);
	    updateGradBoxes(e);
        };
	function onLoad() {
            let fakeMousePos = {
                clientX: 0,
		clientY: 0
	    }
	    updateShiny(fakeMousePos);
	    updateGradBoxes(fakeMousePos);
	}
	document.addEventListener("DOMContentLoaded", onLoad);
    </script>     
</body>
</html>
